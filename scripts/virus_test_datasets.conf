# Shared dataset definitions for virus-positive bulk RNA-seq test-data acquisition.
# Sourced by both virus_test_datasets_manifest.sh (size check, safe on login node)
# and download_virus_test_datasets.sh (actual download, SLURM array job).
#
# Selected via a 27-agent research workflow (2026-08-14) that independently
# re-verified every accession against its live SRA/ENA/GEO page and cited
# publication. Full writeup: docs/pathseq_and_test_datasets_2026-08-14.md
#
# Format per entry: key|ENA-queryable accession|run filter|note
#   run filter: "ALL" or a space-separated list of specific run accessions to keep
#
# NOT included here (handle separately):
#   - PRJNA384203 (Iadorola/LaPaglia HSV-1 TG cohort) — already staged locally in
#     this repo (Iadorola/, assets/config_iadorola_tg.yaml) and presumably already
#     pulled to Juno; re-download only if a fresh/independent copy is specifically
#     wanted.
#   - CRA001750 (tree shrew/human/mouse HSV-1 TG) — lives on the Beijing GSA-Human
#     repository, not SRA/ENA/GEO; needs a different download mechanism (GSA's own
#     HTTPS/FTP/Aspera links at https://ngdc.cncb.ac.cn/gsa/browse/CRA001750), not
#     handled by this ENA-API-driven script.
#   - FDA-ARGOS (PRJNA231221) — deliberately excluded: confirmed no herpesvirus
#     content, and it's WGS of cultured isolates, not RNA-seq.
#
# Sizes below are real, verified via the ENA portal API's fastq_bytes field
# (2026-08-14, ebv_gm12878_encode added 2026-08-15) — not estimates.
# Grand total across all 15 entries: ~898 GB.
#
# NOTE on ebv_gm12878_encode's accession: PRJNA30709 is ENCODE's master
# umbrella BioProject (43M+ runs across the whole consortium) -- do NOT query
# it directly, it will hang/time out. SRP013565 is the actual scoped
# secondary_study_accession these 2 specific runs belong to (~6.9k runs,
# fetches in seconds) -- confirmed via a live ENA filereport call 2026-08-15,
# not assumed from the study hierarchy alone.

OUTBASE="/titan/tprice/ingest/virus"

DATASETS=(
  "ebv_gm12878_encode|SRP013565|SRR3192396 SRR3192397|ENCODE ENCSR000AEC -- GM12878 (constitutively EBV-transformed lymphoblastoid line, Type III latency), polyA+ RNA-seq, PE101, 2 runs, ~31.2 GB -- ENA sample_title explicitly states 'Epstein-Barr Virus'; latent signal, not a lytic-reactivation time course (see ebv_lytic_reactivation below for that, single-end though)"
  "hsv1_fibroblast_lytic|PRJNA851702|ALL|HSV-1 WT-KOS + IE-mutant MRC5 fibroblasts, 9 runs, ~61.9 GB -- mutant arms (dICP4/dICP27/dICP22/dUL30) included; filter to WT/KOS-titled samples afterward if a clean single-strain positive control is wanted"
  "hsv1_npc_timecourse|PRJNA991956|ALL|HSV-1 iPSC-derived neural precursor cell time course, 53 samples, ~63.7 GB -- 2 MOIs x 3 timepoints +/- antivirals"
  "vzv_hsv1_tg|PRJEB23238|ALL|Human trigeminal ganglia, VZV+HSV-1 bait-capture enriched, 19 runs, ~134.7 GB -- real ganglion tissue, independent cohort from the Iadorola/LaPaglia set already in this repo"
  "vzv_shsy5y|PRJNA595561|ALL|SH-SY5Y neuroblastoma VZV infection time course (24h/48h), 9 runs, ~52.6 GB"
  "hsv2_cd4t|PRJNA954351|ALL|Primary CD4+ T cell HSV-2 infection, 27 runs, ~86.1 GB"
  "cmv_fibroblast|SRP108855|SRR5660016 SRR5660017 SRR5660018 SRR5660019|Human CMV/HHV-5 WT-infected MRC-5 fibroblasts, 12/24/48/72 hpi, 4 runs (of 49 in the full series), ~9.2 GB -- directly tests the pipeline's known CMV proxy-taxon issue; scoped to WT-only runs, skips the dUL135/dUL138 mutant + CD34+ HPC + natural-infection arms of the same GEO series"
  "ebv_btransform|PRJNA518137|ALL|EBV primary B-lymphocyte transformation time course (d0-28), 21 runs, single-end, ~22.4 GB"
  "ebv_lytic_reactivation|SRP101998|ALL|EBV GM12878+MutuI lytic reactivation +/- acyclovir, 12 runs, single-end but VERY deep (160-280M reads/run), ~120.7 GB"
  "jcv_pml_brain|PRJEB64568|ALL|JC polyomavirus PML brain tissue, 10 runs, single-end, ~48.3 GB -- real clinical brain tissue"
  "ev71_gerbil_brainstem|PRJNA509196|ALL|EV71 gerbil brainstem, 6 runs, ~15.9 GB"
  "zika_organoid|PRJNA509917|ALL|Zika brain organoid, 74 runs, single-end (36 samples x technical-replicate lanes), ~24.0 GB"
  "wnv_mouse_brain|PRJNA975481|ALL|West Nile virus mouse brain, 36 runs, ~94.6 GB"
  "csf_miller_ucsf|PRJNA516289|ALL|Miller/UCSF CSF mNGS benchmark, PCR-confirmed multi-titer ground truth (HSV-1/CMV/EBVx2/HHV-6 TP, sub-LOD VZV/HSV-2 FN), 230 runs, dual DNA+RNA arms per sample, ~34.2 GB"
  "csf_fan_chinacdc|PRJNA963158|ALL|Fan et al. China CDC CSF/serum mNGS, PCR+Sanger-confirmed HSV-1 + other viruses, 226 runs, MDA-amplified (not standard bulk RNA-seq), ~98.5 GB"
)
