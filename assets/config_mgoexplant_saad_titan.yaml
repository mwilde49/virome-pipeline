# virome-pipeline run config — MGO explant Saad cohort (trial1 only)
# Source: Prometheus z:\data\homo_sapiens\Dorsal_root_ganglia\bulk_rnaseq\2022_MGOexplant_Saad\
#         staged to Titan at /titan/tprice/ingest/virome/2022_MGOexplant_Saad/ (see
#         docs/prometheus_fastq_inventory_2026-08-18.md for the full inventory this
#         was built from).
# 6 samples.
# Only the trial1/raw_seq_files sub-batch (Saad-1 through Saad-6) -- these are
# the only paired-end samples in 2022_MGOexplant_Saad. The trial2_UTD sub-batch
# (286-1 through 286-19, n=19) is R1-only and excluded pending single-end support
# or R2 recovery -- see docs/prometheus_fastq_inventory_2026-08-18.md.
# OPEN QUESTION: docs/cohort_registry.md cohort #4 'Saad DRG' lists only Saad_1-5
# (n=5); this samplesheet has Saad-1 through Saad-6 (n=6). Saad-6 was never in the
# registered 5 -- confirm whether it's a genuine 6th specimen never run, or was
# deliberately dropped before, before treating its results as new.
# Platform: Illumina, paired-end, 150 bp assumed (confirm read length from FastQC).
#
# PREREQUISITE: FASTQs must be staged to scratch before launching -- Juno COMPUTE
# nodes do not have /titan mounted (only login nodes do; confirmed 2026-08-18 via
# a real launch attempt against config_watchmaker_titan.yaml, which failed at
# main.nf's samplesheet-parsing checkIfExists step -- i.e. before any Apptainer
# container was even involved, a plain Nextflow-host-level file check on whatever
# compute node the SLURM job landed on). Stage from a login node (has /titan):
#   rsync -a /titan/tprice/ingest/virome/2022_MGOexplant_Saad/ /scratch/juno/$USER/gataca_fastq/2022_MGOexplant_Saad/
# Confirm before launching:
#   ls /scratch/juno/$USER/gataca_fastq/2022_MGOexplant_Saad/ | head

samplesheet:      "/groups/tprice/pipelines/containers/virome/assets/samplesheets/samplesheet_mgoexplant_saad_titan.csv"
outdir:           "/scratch/juno/maw210003/virome_mgoexplant_saad"

# References (pre-built on Juno)
star_index:    "/groups/tprice/pipelines/references/star_index"
kraken2_db:    "/groups/tprice/pipelines/references/kraken2_viral_db"
kraken2_db2:   "/groups/tprice/pipelines/references/kraken2_pluspf_db"

# Containers
container_dir: "/groups/tprice/pipelines/containers/virome"

# Filtering
min_reads:     5
artifact_list: "/groups/tprice/pipelines/containers/virome/assets/artifact_taxa.tsv"
taxon_remap:   "/groups/tprice/pipelines/containers/virome/assets/taxon_remap.tsv"

# Trimmomatic
trim_adapters: "TruSeq3-PE"
trim_leading:  3
trim_trailing: 3
trim_minlen:   36

# Kraken2
kraken2_confidence: 0.1
bracken_read_len:   150
bracken_level:      "S"
