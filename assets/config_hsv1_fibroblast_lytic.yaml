# virome-pipeline run config — HSV-1 WT-KOS fibroblast positive/negative control
# Source: PRJNA851702, MRC5 fibroblasts, high-MOI (10 PFU/cell) HSV-1 strain
# KOS. Full dataset has 9 runs (WT + 4 IE-gene-deletion mutants); scoped here
# to the clean WT-KOS positive control (SRR19779318, library_name "KOS", no
# drug/RNase modifier) plus its matched Uninfected mock control
# (SRR19779319) -- a true positive/negative pair rather than guessing.
# Run-to-strain mapping confirmed directly against ENA (sample_alias/
# library_name fields), not assumed -- see docs/pathseq_and_test_datasets_2026-08-14.md.
#
# The other 7 runs (mutant arms hp66/n199/5dl1.2/n12 + drug-treated
# KOS_PAA-0h/KOS_CXH-0h + RNaseR_KOS) are available in the same
# /titan/tprice/ingest/virus/hsv1_fibroblast_lytic/ directory if a broader
# panel is wanted later -- add rows to the samplesheet and re-run with
# -resume.
#
# PREREQUISITE:
#   ls -la /titan/tprice/ingest/virus/hsv1_fibroblast_lytic/SRR19779318* /titan/tprice/ingest/virus/hsv1_fibroblast_lytic/SRR19779319*
#
# Launch command (from an interactive compute node on Juno):
#   export NXF_JVM_ARGS="-Xms512m -Xmx2g"
#   nextflow run main.nf -profile slurm -params-file assets/config_hsv1_fibroblast_lytic.yaml

samplesheet: "/groups/tprice/pipelines/containers/virome/assets/samplesheets/samplesheet_hsv1_fibroblast_lytic_juno.csv"
outdir:      "/scratch/juno/maw210003/virome_hsv1_fibroblast_lytic"

star_index:    "/groups/tprice/pipelines/references/star_index"
kraken2_db:    "/groups/tprice/pipelines/references/kraken2_viral_db"
kraken2_db2:   "/groups/tprice/pipelines/references/kraken2_pluspf_db"

container_dir: "/groups/tprice/pipelines/containers/virome"

min_reads:     5
artifact_list: "/groups/tprice/pipelines/containers/virome/assets/artifact_taxa.tsv"
taxon_remap:   "/groups/tprice/pipelines/containers/virome/assets/taxon_remap.tsv"

# 150bp Illumina NovaSeq paired-end per the source publication
trim_adapters: "TruSeq3-PE"
trim_leading:  3
trim_trailing: 3
trim_minlen:   36

kraken2_confidence: 0.1
bracken_read_len:   150
bracken_level:      "S"

save_kraken2_output: true
save_unmapped_reads: true
