# BLAST verification run — 109T3 (thoracic_drg)
# Targets: Molluscum contagiosum virus (10279) and AAV/Dependoparvovirus
# primate1 (1511891) -- the only sample in the cohort survey carrying BOTH
# flagged taxa simultaneously, directly relevant to the SfN abstract's
# multi-taxon HERV-K predictor (HSV-1+AAV+Molluscum, BH-q~0.0498, borderline).
# Molluscum is separately flagged in docs/hervk_findings_comprehensive_2026-08-27.md
# as "this project's least reliable target taxon" (promiscuous correlation
# with unrelated phages) -- a BLAST-negative here is expected/uninformative,
# not surprising.
#
# Prerequisites confirmed 2026-09-20: kraken2.output + star_unmapped FASTQs
# both present (save_kraken2_output/save_unmapped_reads resume, this session).
#
# Launch (from an interactive compute node on Juno):
#   export NXF_JVM_ARGS="-Xms512m -Xmx2g"
#   nextflow run blast_verify.nf -profile slurm -params-file assets/config_blast_109T3.yaml

samplesheet: "/groups/tprice/pipelines/containers/virome/assets/samplesheets/samplesheet_blast_109T3.csv"
outdir:      "/scratch/juno/maw210003/virome_blast_109T3"

target_taxa: "10279,1511891"

blast_db_dir:  "/groups/tprice/pipelines/references/blast_nt"
blast_db_name: "nt"

# No viral_refs_dir entries exist yet for these taxa -- optional, only gates
# the minimap2 coverage-depth sub-step (modules/blast_analyze.nf), not core
# BLAST verification itself.
viral_refs_dir: "/groups/tprice/pipelines/references/viral_refs"

container_dir: "/groups/tprice/pipelines/containers/virome"

blast_evalue:           1e-5
blast_max_targets:      10
blast_word_size:        28
blast_perc_identity:    80
blast_max_reads:        0

blast_pident_threshold: 90.0
blast_evalue_threshold: 1e-5
blast_include_genus:    true
