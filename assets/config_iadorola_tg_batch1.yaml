# virome-pipeline run config — Iadorola et al. human trigeminal ganglia cohort
# BATCH 1: scoped to the 5 samples confirmed fully downloaded as of 2026-08-16
# 19:34 (TG13, TG3, TG2, TG12, TG4) while the remaining 11 continue downloading
# in the background -- lets the pipeline run in parallel with the rest of the
# download instead of waiting on it. Once more samples land, expand
# samplesheet_iadorola_tg_juno.csv (or a batch2 subset) and re-run with
# -resume against the SAME outdir below -- already-completed samples are
# cached and skipped, only the new ones actually run.
#
# Source: BioProject SRP113004 (PMID 28264986); NIMH Human Brain Collection Core
# 16 samples total: TG1–TG22 (not contiguous); all female except TG3, TG11; ages 18–64
# Platform: Illumina HiSeq 2500, 125 bp paired-end, ~33M spots/sample

samplesheet: "/groups/tprice/pipelines/containers/virome/assets/samplesheets/samplesheet_iadorola_tg_batch1_juno.csv"
outdir:      "/scratch/juno/maw210003/virome_iadorola_tg"

# References (pre-built on Juno)
star_index:    "/groups/tprice/pipelines/references/star_index"
kraken2_db:    "/groups/tprice/pipelines/references/kraken2_viral_db"
kraken2_db2:   "/groups/tprice/pipelines/references/kraken2_pluspf_db"

# Containers
container_dir: "/groups/tprice/pipelines/containers/virome"

# Filtering
min_reads:     5
artifact_list: "/groups/tprice/pipelines/containers/virome/assets/artifact_taxa.tsv"
taxon_remap:   "/groups/tprice/pipelines/containers/virome/assets/taxon_remap.tsv"

# Trimmomatic
trim_adapters: "TruSeq3-PE"
trim_leading:  3
trim_trailing: 3
trim_minlen:   36

# Kraken2
kraken2_confidence: 0.1
bracken_read_len:   125
bracken_level:      "S"

# Publish intermediate files needed for the pathseq_verify.nf offshoot
save_kraken2_output: true
save_unmapped_reads: true
