# virome-pipeline run config — Unknown doloromics cohort
# Source: Prometheus z:\data\homo_sapiens\Dorsal_root_ganglia\bulk_rnaseq\2022_unknown_doloromics\
#         staged to Titan at /titan/tprice/ingest/virome/2022_unknown_doloromics/ (see
#         docs/prometheus_fastq_inventory_2026-08-18.md for the full inventory this
#         was built from).
# 8 samples.
# Dataset folder is literally named 'unknown' on Prometheus -- FASTQs are clean
# (8 samples, fully paired) but experimental-condition/provenance metadata is not
# established. Fine for a raw virus-detection pass; needs metadata tracked down
# before results here are used in anything cross-cohort or publication-facing.
# Platform: Illumina, paired-end, 150 bp assumed (confirm read length from FastQC).
#
# PREREQUISITE: FASTQs must be staged to scratch before launching -- Juno COMPUTE
# nodes do not have /titan mounted (only login nodes do; confirmed 2026-08-18 via
# a real launch attempt against config_watchmaker_titan.yaml, which failed at
# main.nf's samplesheet-parsing checkIfExists step -- i.e. before any Apptainer
# container was even involved, a plain Nextflow-host-level file check on whatever
# compute node the SLURM job landed on). Stage from a login node (has /titan):
#   rsync -a /titan/tprice/ingest/virome/2022_unknown_doloromics/ /scratch/juno/$USER/gataca_fastq/2022_unknown_doloromics/
# Confirm before launching:
#   ls /scratch/juno/$USER/gataca_fastq/2022_unknown_doloromics/ | head

samplesheet:      "/groups/tprice/pipelines/containers/virome/assets/samplesheets/samplesheet_unknown_doloromics_titan.csv"
outdir:           "/scratch/juno/maw210003/virome_unknown_doloromics"

# References (pre-built on Juno)
star_index:    "/groups/tprice/pipelines/references/star_index"
kraken2_db:    "/groups/tprice/pipelines/references/kraken2_viral_db"
kraken2_db2:   "/groups/tprice/pipelines/references/kraken2_pluspf_db"

# Containers
container_dir: "/groups/tprice/pipelines/containers/virome"

# Filtering
min_reads:     5
artifact_list: "/groups/tprice/pipelines/containers/virome/assets/artifact_taxa.tsv"
taxon_remap:   "/groups/tprice/pipelines/containers/virome/assets/taxon_remap.tsv"

# Trimmomatic
trim_adapters: "TruSeq3-PE"
trim_leading:  3
trim_trailing: 3
trim_minlen:   36

# Kraken2
kraken2_confidence: 0.1
bracken_read_len:   150
bracken_level:      "S"

# PathSeq offshoot prerequisite (2026-08-19): publish STAR-unmapped FASTQs so
# pathseq_verify.nf's samplesheet (assets/samplesheets/samplesheet_pathseq_<cohort>.csv)
# can point at them directly, per the "every sample, every cohort" full-cohort
# PathSeq validation plan for this batch. ~2GB/sample added to outdir size.
# Retroactive on an already-running/-completed cohort: re-launch with -resume
# against that cohort's real session ID -- STAR_HOST_REMOVAL cache-hits
# instantly for every sample, this only adds the publish copy.
save_unmapped_reads: true
