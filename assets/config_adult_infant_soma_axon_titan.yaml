# virome-pipeline run config — Adult/Infant Soma/Axon cohort (Asta)
# Source: Prometheus z:\data\homo_sapiens\Dorsal_root_ganglia\bulk_rnaseq\2024_Adult.Infant.Soma.Axon_Asta\
#         staged to Titan at /titan/tprice/ingest/virome/2024_Adult.Infant.Soma.Axon_Asta/ (see
#         docs/prometheus_fastq_inventory_2026-08-18.md for the full inventory this
#         was built from).
# 10 samples.
# Sample IDs (366-1 through 366-10) share a numbering prefix with
# 2023_OSMcultured_doloromics.Juliet's 366-11 through 366-16 -- possibly the same
# 366 plate/submission split across two dataset folders from different years.
# 366-10 specifically also appears (R1-only, excluded) in the OSMcultured folder --
# verify these aren't the same physical sample referenced twice before pooling
# results across both cohorts.
# Platform: Illumina, paired-end, 150 bp assumed (confirm read length from FastQC).
#
# PREREQUISITE: FASTQs must be staged to scratch before launching -- Juno COMPUTE
# nodes do not have /titan mounted (only login nodes do; confirmed 2026-08-18 via
# a real launch attempt against config_watchmaker_titan.yaml, which failed at
# main.nf's samplesheet-parsing checkIfExists step -- i.e. before any Apptainer
# container was even involved, a plain Nextflow-host-level file check on whatever
# compute node the SLURM job landed on). Stage from a login node (has /titan):
#   rsync -a /titan/tprice/ingest/virome/2024_Adult.Infant.Soma.Axon_Asta/ /scratch/juno/$USER/gataca_fastq/2024_Adult.Infant.Soma.Axon_Asta/
# Confirm before launching:
#   ls /scratch/juno/$USER/gataca_fastq/2024_Adult.Infant.Soma.Axon_Asta/ | head

samplesheet:      "/groups/tprice/pipelines/containers/virome/assets/samplesheets/samplesheet_adult_infant_soma_axon_titan.csv"
outdir:           "/scratch/juno/maw210003/virome_adult_infant_soma_axon"

# References (pre-built on Juno)
star_index:    "/groups/tprice/pipelines/references/star_index"
kraken2_db:    "/groups/tprice/pipelines/references/kraken2_viral_db"
kraken2_db2:   "/groups/tprice/pipelines/references/kraken2_pluspf_db"

# Containers
container_dir: "/groups/tprice/pipelines/containers/virome"

# Filtering
min_reads:     5
artifact_list: "/groups/tprice/pipelines/containers/virome/assets/artifact_taxa.tsv"
taxon_remap:   "/groups/tprice/pipelines/containers/virome/assets/taxon_remap.tsv"

# Trimmomatic
trim_adapters: "TruSeq3-PE"
trim_leading:  3
trim_trailing: 3
trim_minlen:   36

# Kraken2
kraken2_confidence: 0.1
bracken_read_len:   150
bracken_level:      "S"
