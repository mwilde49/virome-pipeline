# virome-pipeline run config — TG 2018 Emma NIH cohort
# Source: gataca z:\data\homo_sapiens\Trigeminal_ganglia\bulk_rnaseq\2018_Emma_NIH\fastq\
#         (SRA-style _1/_2 naming -- SRR5850220 through SRR5850235, 16 samples, all
#         present and complete, no stub/empty files this time).
# A "STAR" subfolder also exists alongside "fastq" at the source -- some prior
# alignment output from a different project/pipeline, not used here; this
# pipeline runs its own STAR_HOST_REMOVAL against its own canonical index
# regardless.
# 16 samples. Platform: Illumina, paired-end, 150 bp assumed (confirm read
# length from FastQC -- 2018 SRA data, may differ from the 2022+ DRG batch).
#
# PREREQUISITE: two-hop staging, same pattern as the 2026-08-18 DRG batch
# (see docs/cohort_registry.md's Planned section for why compute nodes can't
# read /titan directly) --
#   1. gataca -> Titan (run from bbs88355, the linux relay machine):
#      rsync -avP -e "ssh -o ControlPath=$HOME/.ssh/controlmasters/juno-%r@%h:%p" \
#        /mnt/gataca/data/homo_sapiens/Trigeminal_ganglia/bulk_rnaseq/2018_Emma_NIH/fastq/*.fastq.gz \
#        maw210003@juno.hpcre.utdallas.edu:/titan/tprice/ingest/virome/2018_Emma_NIH/
#   2. Titan -> scratch (run from a JUNO LOGIN node, e.g. juno-l-01 -- compute
#      nodes cannot read /titan):
#      rsync -avP /titan/tprice/ingest/virome/2018_Emma_NIH/ \
#        /scratch/juno/$USER/gataca_fastq/2018_Emma_NIH/
# Confirm before launching:
#   ls /scratch/juno/$USER/gataca_fastq/2018_Emma_NIH/ | wc -l   # expect 32 (16 x _1/_2)

samplesheet:      "/groups/tprice/pipelines/containers/virome/assets/samplesheets/samplesheet_tg_2018_emma_nih_titan.csv"
outdir:           "/scratch/juno/maw210003/virome_tg_2018_emma_nih"

# References (pre-built on Juno)
star_index:    "/groups/tprice/pipelines/references/star_index"
kraken2_db:    "/groups/tprice/pipelines/references/kraken2_viral_db"
kraken2_db2:   "/groups/tprice/pipelines/references/kraken2_pluspf_db"

# Containers
container_dir: "/groups/tprice/pipelines/containers/virome"

# Filtering
min_reads:     5
artifact_list: "/groups/tprice/pipelines/containers/virome/assets/artifact_taxa.tsv"
taxon_remap:   "/groups/tprice/pipelines/containers/virome/assets/taxon_remap.tsv"

# Trimmomatic
trim_adapters: "TruSeq3-PE"
trim_leading:  3
trim_trailing: 3
trim_minlen:   36

# Kraken2
kraken2_confidence: 0.1
bracken_read_len:   150
bracken_level:      "S"

# PathSeq offshoot prerequisite (2026-08-19): publish STAR-unmapped FASTQs so
# pathseq_verify.nf's samplesheet (assets/samplesheets/samplesheet_pathseq_<cohort>.csv)
# can point at them directly, per the "every sample, every cohort" full-cohort
# PathSeq validation plan for this batch. ~2GB/sample added to outdir size.
# Retroactive on an already-running/-completed cohort: re-launch with -resume
# against that cohort's real session ID -- STAR_HOST_REMOVAL cache-hits
# instantly for every sample, this only adds the publish copy.
save_unmapped_reads: true
