# PathSeq verification offshoot — unknown_doloromics cohort (full-cohort, every sample)
#
# Scope decision (2026-08-19): unlike prior PathSeq runs (cmv_fibroblast,
# vzv_hsv1_tg, ebv_gm12878, iadorola_tg — all targeted at specific Tier 1
# candidates), this batch runs PathSeq on EVERY sample in every one of the
# 11 gataca->Titan->scratch cohorts (167-6=161 samples total across the
# batch, lumar_drg excluded per its recommend-exclude status) as a full
# third-opinion validation baseline, not a targeted follow-up. This is a
# deliberate, much larger compute commitment than PathSeq's routine use —
# see CLAUDE.md's "PathSeq verification offshoot" section for the per-task
# cost (200 GB / 32 cpu / up to 48h, conf/base.config) driving that choice.
#
# PREREQUISITE: assets/config_unknown_doloromics_titan.yaml now sets
# save_unmapped_reads: true. If the main unknown_doloromics run already completed
# before that flag was added, re-launch it once more with -resume against
# its real session ID first -- STAR_HOST_REMOVAL cache-hits instantly for
# every sample, this only adds the publish copy to ${outdir}/star_unmapped/.
# Confirm before launching:
#   ls /scratch/juno/maw210003/virome_unknown_doloromics/star_unmapped/ | wc -l   # expect 16 (8 samples x R1/R2)
#
# EXCLUSION (2026-08-23): sample 4A-R removed from
# assets/samplesheets/samplesheet_pathseq_unknown_doloromics.csv (now 7
# samples, not 8). PATHSEQ_SCORE OOM-killed on this sample twice -- once at
# the standard 200GB (11 min in), once at a one-off 340GB override (12m30s
# in, see assets/config_pathseq_highmem_override.config) -- barely any extra
# runway despite +70% memory, which is the tell this isn't "needs more RAM."
# Checked 4A-R's own Kraken2 (bracken_raw) classification directly: 6.77M of
# 6.82M total classified reads (99.3%) are three taxa already documented in
# assets/artifact_taxa.tsv as reagent/cross-mapping contaminants
# (Orthobunyavirus schmallenbergense 3960024 reads, Orthobunyavirus
# simbuense 1765902 reads, Betabaculovirus chofumiferanae 1046551 reads) --
# real biology (HERV-K) is 3513 reads underneath that noise. Kraken2's own
# pipeline already excludes these via artifact_taxa.tsv, which is exactly
# why 4A-R's Kraken2/filtered results (already in the tracking workbook) are
# fine; PathSeq has no equivalent pre-filter and pays the alignment cost for
# millions of highly-repetitive contaminant reads before it can even get to
# the real signal -- a multi-mapping memory blowup in BWA-MEM, not a fixed
# "needs X GB" shortfall, hence more memory not helping proportionally.
# 4A-R's own Kraken2/filtered results stand as-is; this exclusion is
# PathSeq-arm-only, same treatment as 104T8R (thoracic_drg)/Saad_2
# (mgoexplant_saad) elsewhere in this project.
#
# Launch on Juno (from an interactive compute node, or via
# scripts/run_pathseq_config.sbatch as a background SLURM job):
#   export NXF_JVM_ARGS="-Xms512m -Xmx2g"
#   nextflow run pathseq_verify.nf -profile slurm -params-file assets/config_pathseq_unknown_doloromics.yaml

samplesheet: "/groups/tprice/pipelines/containers/virome/assets/samplesheets/samplesheet_pathseq_unknown_doloromics.csv"
outdir:      "/scratch/juno/maw210003/virome_pathseq_unknown_doloromics"

# --- PathSeq microbe/taxonomy reference bundle (RefSeq release 81, April 2017) ---
pathseq_microbe_bwa_image: "/groups/tprice/pipelines/references/pathseq/pathseq_microbe.fa.img"
pathseq_microbe_fasta:     "/groups/tprice/pipelines/references/pathseq/pathseq_microbe.fa"
pathseq_taxonomy:          "/groups/tprice/pipelines/references/pathseq/pathseq_taxonomy.db"

# Every sample's entire unmapped pool is scored taxonomy-wide regardless of
# this setting (see pathseq_verify.nf's own docs) -- consensus_matrix here
# only curates which taxa AGGREGATE_PATHSEQ highlights in
# pathseq_concordance.tsv, pointing at this cohort's own dual-DB Tier 1
# result. Harmless if db_comparison/ doesn't exist yet at launch time for a
# cohort still mid-run -- falls back to reporting every taxon PathSeq itself
# detected.
consensus_matrix: "/scratch/juno/maw210003/virome_unknown_doloromics/results/db_comparison/consensus_matrix.tsv"

container_dir: "/groups/tprice/pipelines/containers/virome"
